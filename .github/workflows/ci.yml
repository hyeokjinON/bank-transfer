name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # 평소 6분 안팎. 멈추면 6시간이 아니라 30분에 실패하게 하고, 20분이 지나도 돌고 있으면 JVM 스레드 덤프를 남긴다
      # (P7 머지 뒤 테스트 JVM 이 3시간 멈춘 일이 있다 — 덤프가 없어 원인 미확인. 가상 스레드까지 보이게 Thread.dump_to_file)
      - name: Build and test
        timeout-minutes: 30
        run: |
          ( sleep 1200; mkdir -p build/hang-dumps
            for p in $(jps -q); do jcmd "$p" Thread.dump_to_file -format=text "$PWD/build/hang-dumps/$p.txt" || true; done
          ) > /dev/null 2>&1 &
          WATCH=$!
          status=0; ./gradlew build --no-daemon || status=$?
          kill "$WATCH" 2>/dev/null || true
          exit "$status"
      - name: Upload test reports
        if: failure() || cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            build/hang-dumps/

  # 로컬 인프라 파일(infra/docker-compose.yml)이 실제로 뜨고 읽기/쓰기가 되는지 확인 (ADR-0003)
  infra-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Start MySQL, Kafka (KRaft), Redis
        run: docker compose -f infra/docker-compose.yml --env-file infra/.env.example up -d --wait --wait-timeout 240
      - name: Verify read/write
        run: bash infra/verify.sh
      - name: Logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml --env-file infra/.env.example logs --no-color
      - name: Stop
        if: always()
        run: docker compose -f infra/docker-compose.yml --env-file infra/.env.example down -v

  # 앱 이미지 3개 · Compose app 프로필(모의 은행 · 게이트웨이 · api 2대 · nginx)이 실제로 뜨고, nginx 를 거쳐 1원인증 · 출금이 되는지 (P8-2, ADR-0016)
  app-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      # .env.example 의 비밀번호는 application.yml 기본값과 같아 "이미지에 비밀번호 값이 없다" 를 확인할 수 없다 — 실행마다 임의 값으로 바꾼다
      - name: CI 용 infra/.env (비밀번호는 임의 값)
        run: |
          cp infra/.env.example infra/.env
          sed -i "s/^MYSQL_PASSWORD=.*/MYSQL_PASSWORD=ci-$(openssl rand -hex 12)/; s/^MYSQL_ROOT_PASSWORD=.*/MYSQL_ROOT_PASSWORD=ci-$(openssl rand -hex 12)/" infra/.env
      - uses: docker/setup-buildx-action@v4
      # 이미지마다 GitHub Actions 캐시(type=gha)에 층을 남긴다. 같은 잡 안에서는 빌더가 빌드 단계를 한 번만 돌리고 나머지 타깃이 재사용한다.
      # Gradle 의존성 캐시 마운트는 gha 캐시로 넘어가지 않는다 — 코드가 바뀐 실행은 의존성을 다시 받는다 (15분 넘으면 스펙 §9)
      - name: Build api image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          tags: bank-transfer/api:dev
          load: true
          cache-from: type=gha,scope=app-api
          cache-to: type=gha,mode=max,scope=app-api
      - name: Build bank-gateway image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: bank-gateway
          tags: bank-transfer/bank-gateway:dev
          load: true
          cache-from: type=gha,scope=app-bank-gateway
          cache-to: type=gha,mode=max,scope=app-bank-gateway
      - name: Build mock-bank image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: mock-bank
          tags: bank-transfer/mock-bank:dev
          load: true
          cache-from: type=gha,scope=app-mock-bank
          cache-to: type=gha,mode=max,scope=app-mock-bank
      - name: Start infra + app profile
        env:
          BANK_MAINTENANCE_ENABLED: "false"   # 점검 시간(23:50 ~ 00:10 KST)에 돌아도 503 이 나지 않게
        run: docker compose -f infra/docker-compose.yml --env-file infra/.env --profile app up -d --no-build --wait --wait-timeout 300
      - name: Smoke through nginx
        run: bash infra/app-smoke.sh
      - name: Logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml --env-file infra/.env --profile app logs --no-color
      - name: Stop
        if: always()
        run: docker compose -f infra/docker-compose.yml --env-file infra/.env --profile app down -v

  # kind 클러스터에 같은 매니페스트를 올려 Envoy Gateway 입구로 1원인증 · 출금이 되는지 (P8-3a, ADR-0017).
  # 이미지 캐시는 app-smoke 와 같은 범위(scope)를 함께 쓴다 — 같은 Dockerfile · 같은 타깃
  k8s-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: CI 용 infra/.env (비밀번호는 임의 값)
        run: |
          cp infra/.env.example infra/.env
          sed -i "s/^MYSQL_PASSWORD=.*/MYSQL_PASSWORD=ci-$(openssl rand -hex 12)/; s/^MYSQL_ROOT_PASSWORD=.*/MYSQL_ROOT_PASSWORD=ci-$(openssl rand -hex 12)/" infra/.env
      - name: kind · kubectl 설치 (버전은 infra/k8s/versions.env, 체크섬 확인)
        run: |
          . infra/k8s/versions.env
          curl -fsSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-amd64"
          echo "$(curl -fsSL "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-amd64.sha256sum" | awk '{print $1}')  kind" | sha256sum -c -
          curl -fsSLo kubectl "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
          echo "$(curl -fsSL "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl.sha256")  kubectl" | sha256sum -c -
          chmod +x kind kubectl && sudo mv kind kubectl /usr/local/bin/
          kind version && kubectl version --client
      - name: 매니페스트 빌드 (모든 overlay)
        run: for o in infra/k8s/overlays/*/; do kubectl kustomize "$o" > /dev/null && echo "ok $o"; done
      - uses: docker/setup-buildx-action@v4
      - name: Build api image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          tags: bank-transfer/api:ci
          load: true
          cache-from: type=gha,scope=app-api
          cache-to: type=gha,mode=max,scope=app-api
      - name: Build bank-gateway image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: bank-gateway
          tags: bank-transfer/bank-gateway:ci
          load: true
          cache-from: type=gha,scope=app-bank-gateway
          cache-to: type=gha,mode=max,scope=app-bank-gateway
      - name: Build mock-bank image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: mock-bank
          tags: bank-transfer/mock-bank:ci
          load: true
          cache-from: type=gha,scope=app-mock-bank
          cache-to: type=gha,mode=max,scope=app-mock-bank
      - name: kind 클러스터 · Envoy Gateway · 매니페스트 (overlays/ci)
        env:
          SKIP_BUILD: "1"
          IMAGE_TAG: ci
        run: bash infra/k8s/up.sh ci
      - name: Smoke through Envoy Gateway
        run: bash infra/k8s/smoke.sh
      - name: 실패 시 상태 · 로그
        if: failure()
        run: |
          kubectl --context kind-bank-transfer get nodes -o wide || true
          kubectl --context kind-bank-transfer get pods -A -o wide || true
          kubectl --context kind-bank-transfer -n bank-transfer describe pods || true
          for a in mysql kafka redis mock-bank bank-gateway api; do echo "=== $a"; kubectl --context kind-bank-transfer -n bank-transfer logs -l app=$a --tail=200 --prefix || true; done
          kubectl --context kind-bank-transfer -n envoy-gateway-system logs deploy/envoy-gateway --tail=200 || true
          kubectl --context kind-bank-transfer -n bank-transfer get gateways.gateway.networking.k8s.io,httproutes -o yaml || true
      - name: Stop
        if: always()
        run: kind delete cluster --name bank-transfer || true
