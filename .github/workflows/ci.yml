name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # 평소 6분 안팎. 멈추면 6시간이 아니라 30분에 실패하게 하고, 20분이 지나도 돌고 있으면 JVM 스레드 덤프를 남긴다
      # (P7 머지 뒤 테스트 JVM 이 3시간 멈춘 일이 있다 — 덤프가 없어 원인 미확인. 가상 스레드까지 보이게 Thread.dump_to_file)
      - name: Build and test
        timeout-minutes: 30
        run: |
          ( sleep 1200; mkdir -p build/hang-dumps
            for p in $(jps -q); do jcmd "$p" Thread.dump_to_file -format=text "$PWD/build/hang-dumps/$p.txt" || true; done
          ) > /dev/null 2>&1 &
          WATCH=$!
          status=0; ./gradlew build --no-daemon || status=$?
          kill "$WATCH" 2>/dev/null || true
          exit "$status"
      - name: Upload test reports
        if: failure() || cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            build/hang-dumps/

  # 로컬 인프라 파일(infra/docker-compose.yml)이 실제로 뜨고 읽기/쓰기가 되는지 확인 (ADR-0003)
  infra-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Start MySQL, Kafka (KRaft), Redis
        run: docker compose -f infra/docker-compose.yml --env-file infra/.env.example up -d --wait --wait-timeout 240
      - name: Verify read/write
        run: bash infra/verify.sh
      - name: Logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml --env-file infra/.env.example logs --no-color
      - name: Stop
        if: always()
        run: docker compose -f infra/docker-compose.yml --env-file infra/.env.example down -v
