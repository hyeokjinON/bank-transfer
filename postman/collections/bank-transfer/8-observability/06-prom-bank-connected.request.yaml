$kind: http-request
name: '8-6 Prometheus 은행 연결 → 1 (은행 끊김 중이면 0)'
method: GET
url: '{{promUrl}}/api/v1/query?query=max(banktransfer_gateway_bank_connected)'
order: 6000
queryParams:
  - key: query
    value: 'max(banktransfer_gateway_bank_connected)'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // port-forward(9090) 창이 꺼져 있으면 연결 오류 — 폴더 설명의 명령을 다시 실행
      const r = pm.response.json();
      const v = r.data.result.length ? r.data.result[0].value[1] : "(시계열 없음)";
      pm.test("Prometheus 응답 success — 값 " + v, () => pm.expect(r.status).to.eql("success"));
