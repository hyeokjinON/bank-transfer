$kind: http-request
name: '8-8 Prometheus 5분간 접수 증가 (근사치, 8-2 횟수와 비슷)'
method: GET
url: 'http://127.0.0.1:9090/api/v1/query?query=sum(increase(banktransfer_transfer_accepted_total[5m]))'
order: 8000
queryParams:
  - key: query
    value: 'sum(increase(banktransfer_transfer_accepted_total[5m]))'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // port-forward(9090) 창이 꺼져 있으면 연결 오류 — 폴더 설명의 명령을 다시 실행
      const r = pm.response.json();
      const v = r.data.result.length ? r.data.result[0].value[1] : "(시계열 없음)";
      pm.test("Prometheus 응답 success — 값 " + v, () => pm.expect(r.status).to.eql("success"));
