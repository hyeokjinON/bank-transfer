$kind: collection
name: 8. 관측 (P9a, kind)
description: |-
  P9a 머지 전 손 확인. kind 클러스터 전용 — 주소는 컬렉션 변수 k8sUrl(입구 http://127.0.0.1:8000) · promUrl(Prometheus http://127.0.0.1:9090) 를 쓴다 (baseUrl 은 건드리지 않는다).
  먼저 Git Bash 창 두 개에 port-forward 를 켜 둔다:
    kubectl --context kind-bank-transfer -n monitoring port-forward svc/prometheus 9090:9090
    kubectl --context kind-bank-transfer -n monitoring port-forward svc/grafana 3000:3000
  8-1 → 8-9 를 위에서부터 Send. 8-2 가 422 ACCOUNT_NOT_VERIFIED 면 user-1 이 {{accountNo}} 를 kind 에서 아직 인증하지 않은 것 — "1. 1원인증" 을 baseUrl 을 k8sUrl 로 바꿔 먼저 (또는 PR #35 본문 참고).
  은행 끊기 확인: mock-bank 를 replicas 0 으로 → 8-2 출금 → 약 1분 뒤 8-6(연결 0) · 8-9(BankDisconnected firing) → replicas 1 → 2분쯤 뒤 8-9 에서 사라짐, 8-3 으로 그 출금이 COMPLETED 될 때까지 (최대 6분쯤).
order: 8000
