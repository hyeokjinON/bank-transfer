$kind: http-request
name: 5-8 (P4-2, 수동 단독) redis 전략 + Redis 정지 → 503 WALLET_BUSY + Retry-After
method: POST
url: '{{baseUrl}}/api/v1/transfers'
order: 8000
description: |-
  수동 확인 전용 — 컬렉션 변수 manualWalletBusy 가 true 일 때만 나간다. 아니면 요청 전 스크립트가 건너뛰므로 폴더 Run 은 안전하다
  (기본 전략 conditional 에서 보내면 202 가 나 503 검사가 실패하고 user-1 의 잔고도 1,000원 빠져 5-3 · 5-7 의 정확한 잔고 검사가 어긋난다).
  켜는 법: 아래 준비를 마친 뒤 컬렉션 변수 manualWalletBusy 를 true 로 두고 이 요청만 단독으로 Send. 끝나면 비운다.
  준비: API 를 redis 전략으로 띄우고(./gradlew :apps:api:bootRun --args="--wallet.debit-strategy=redis"),
  docker compose -f infra/docker-compose.yml --env-file infra/.env stop redis 로 Redis 를 멈춘 뒤 Send.
  끝나면 start redis. Redis 가 살아 있으면 202 다 (http/transfer.http 10-1 · 10-2).
headers:
  - key: Content-Type
    value: application/json
  - key: X-User-Id
    value: '{{userId}}'
  - key: Idempotency-Key
    value: '{{$guid}}'
body:
  type: json
  content: |-
    {
      "bankCode": "090",
      "accountNo": "{{accountNo}}",
      "amount": 1000,
      "memo": "락확인"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // 폴더 Run 이 실수로 보내면 user-1 잔고가 빠져 5-3 · 5-7 이 어긋난다 → 수동으로 켠 때만 보낸다
      if (pm.variables.get("manualWalletBusy") !== "true") {
        pm.execution.skipRequest();
      }
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("503 WALLET_BUSY (Redis 에 닿지 않으면 락 없이 진행하지 않는다)", () => {
        pm.response.to.have.status(503);
        pm.expect(pm.response.json().code).to.eql("WALLET_BUSY");
      });
      pm.test("Retry-After: 1 (잠시 뒤 같은 요청을 다시)", () => {
        pm.expect(pm.response.headers.get("Retry-After")).to.eql("1");
      });
