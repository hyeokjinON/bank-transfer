    kubectl --context kind-bank-transfer -n monitoring port-forward svc/tempo 3200:3200
    kubectl --context kind-bank-transfer -n monitoring port-forward svc/grafana 3000:3000
  9-1 출금 → 약 15초 기다림 (보내기 묶음 5초 + Tempo 수집) → 9-2 · 9-3.
