# P9a Grafana 데이터소스 (프로비저닝 — 손으로 만들지 않는다). uid 를 고정해 대시보드 JSON 이 이 이름으로 찾는다
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus.monitoring.svc.cluster.local:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s
