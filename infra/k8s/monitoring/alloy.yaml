# P9c Alloy (스펙 §4, 결정 F2 · F10) — DaemonSet: 노드마다 1개 (제어 노드 포함 3개)가 /var/log/pods 를 읽기 전용으로 읽어 Loki 로 보낸다.
# 앱은 표준 출력에만 쓴다 — Alloy · Loki 가 죽어도 앱은 그대로. 위치 기록은 노드의 /var/lib/alloy (hostPath — Pod 가 바뀌어도 이어 읽는다, 실험 L5)
# root 로 돈다: 노드의 로그 파일이 root:root 0640 이다 (위험 R1). 능력(capability)은 모두 버린다 — 같은 소유자라 읽힌다
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
spec:
  selector:
    matchLabels: {app: alloy}
  updateStrategy: {type: RollingUpdate}
  template:
    metadata:
      labels: {app: alloy}
    spec:
      serviceAccountName: alloy   # discovery.kubernetes — bank-transfer namespace 의 Pod 목록만 (base/rbac-alloy.yaml)
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      containers:
        - name: alloy
          image: grafana/alloy   # 태그 = versions.env ALLOY_VERSION (apply_overlay)
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data
            - --server.http.listen-addr=0.0.0.0:12345   # 기본 127.0.0.1 — kubelet probe · 실험(L2 /metrics)이 닿게
            - --disable-reporting                       # 밖으로 나가는 사용 통계를 끈다
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          ports:
            - {name: http, containerPort: 12345}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 5
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 128Mi, cpu: 50m}
            limits: {memory: 512Mi}   # 표본 실행 RSS 약 200MiB — L2 로 확인
          volumeMounts:
            - {name: config, mountPath: /etc/alloy}
            - {name: pods, mountPath: /var/log/pods, readOnly: true}
            - {name: state, mountPath: /var/lib/alloy}
      volumes:
        - name: config
          configMap: {name: alloy-config}
        - name: pods
          hostPath: {path: /var/log/pods, type: Directory}
        - name: state
          hostPath: {path: /var/lib/alloy, type: DirectoryOrCreate}
