# P9a Alertmanager (스펙 §6 · §7, 결정 D5). 받는 곳은 클러스터 안 alert-sink 하나 (로그 출력 — 운영이면 Slack · 텔레그램 자리).
# 묶기 = alertname, 처음 10초 기다림 · 같은 묶음 다음 알림 1분 · 같은 알림 반복 1시간. 해제도 보낸다.
route:
  receiver: alert-sink
  group_by: [alertname]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: alert-sink
    webhook_configs:
      - url: http://alert-sink.monitoring.svc.cluster.local:8080/cgi-bin/sink
        send_resolved: true

inhibit_rules:
  # 원인 하나 · 알림 하나 — 리더가 없으면 은행 회선도 당연히 없다
  - source_matchers: [alertname="GatewayNoLeader"]
    target_matchers: [alertname="BankDisconnected"]
  # P9c: 은행 끊김 · 리더 없음 동안 그 장애가 낳는 ERROR 로그 알림은 억제 (결정 F9 — 같은 장애 두 번 울리지 않기).
  #      은행 끊김의 DLT 발행 ERROR 는 규칙 식에서 이미 뺐다 (loki/rules.yml) — 이 억제는 그 밖의 ERROR 몫
  - source_matchers: [alertname=~"BankDisconnected|GatewayNoLeader"]
    target_matchers: [alertname="ErrorLogSurge"]
