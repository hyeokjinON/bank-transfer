# 은행 게이트웨이 2대 (P8-3b). active-standby: Lease 리더 1대만 은행에 붙고, 리더가 자기 Pod 에 붙이는 라벨로 Service 가 리더만 고른다.
# 둘 다 Ready (대기자 bankConnection = UP standby) — 롤링(maxUnavailable 0) · rollout status · PDB 가 정상 동작한다 (스펙 §16)
apiVersion: v1
kind: Service
metadata:
  name: bank-gateway
  labels: {app: bank-gateway}
spec:
  selector: {app: bank-gateway, bank-transfer/gateway-role: leader}
  ports:
    - {name: http, port: 8082}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-gateway
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}   # 새 Pod 가 Ready(대기자) 된 뒤에 옛 Pod 를 내린다 — 옛 리더는 SIGTERM 에 반납, 대기자가 이어받는다
  selector:
    matchLabels: {app: bank-gateway}
  template:
    metadata:
      labels: {app: bank-gateway}
      annotations:   # P9a: Prometheus 가 리더 · 대기 둘 다 직접 수집 (Service 는 리더만 고르지만 수집은 Pod 로 간다)
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: /actuator/prometheus
    spec:
      serviceAccountName: bank-gateway   # Lease · ConfigMap · 자기 Pod 라벨 (rbac-gateway.yaml)
      enableServiceLinks: false   # bank-gateway Service 가 BANK_GATEWAY_PORT=tcp://… 를 넣으면 bank.gateway.port 바인딩이 깨진다
      terminationGracePeriodSeconds: 45   # 정상 ≈ 비우기 5s + graceful 20s. API 서버가 응답 없으면 stop() 이 최대 ≈27s(비우기 5 + worker 2 + 라벨 5 + 반납 10 + 반납 확인 ≤5) + graceful 20s 로 45 를 넘어 SIGKILL 될 수 있다 — 은행 연결은 처음 ≤5s 안에 이미 닫혀 안전하고, 대기자는 Lease 만료를 기다린다
      nodeSelector: {bank-transfer/role: app}
      # 두 대를 반드시 다른 워커에 (P8-3c, ADR-0019) — 한 노드에 몰리면 그 노드 장애에 리더 · 대기가 같이 죽는다 (P8-3b H4′ 변형 353초).
      # DoNotSchedule: 나눌 수 없으면 같은 노드에 띄우지 않고 Pending 으로 기다린다 → 빠진 워커가 돌아오면 그 워커에 뜬다 (나뉜 상태가 저절로 복구).
      # nodeTaintsPolicy Ignore(기본값, 의도를 명시): cordon · 장애로 taint 가 붙은 워커도 "자리" 로 센다 — Honor 면 그 워커를 빼고 계산해 남은 워커로 몰린다.
      # nodeAffinityPolicy Honor(기본값): nodeSelector(role=app) 에 맞는 워커 2대만 자리로 센다 (제어 노드 제외).
      # 대가: 워커가 빠진 동안은 대기자 없이 1대 (몰려 있어도 노드 장애에는 둘 다 죽으므로 잃는 것은 "프로세스만 죽을 때의 빠른 교대" 뿐).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Ignore
          nodeAffinityPolicy: Honor
          labelSelector:
            matchLabels: {app: bank-gateway}
          # 같은 리비전끼리만 센다 (P8-3a 와 같다). DoNotSchedule 에서는 더 중요하다 — 옛 Pod 까지 세면 워커 2개가 모두 차 있어
          # 롤링(maxSurge 1)의 새 Pod 가 갈 곳이 없어 배포가 멈춘다 (필수 anti-affinity 를 고르지 않은 이유)
          matchLabelKeys: [pod-template-hash]
      containers:
        - name: bank-gateway
          image: bank-transfer/bank-gateway:dev
          imagePullPolicy: IfNotPresent
          env:
            - {name: BANK_GATEWAY_HOST, value: mock-bank}
            - {name: BANK_GATEWAY_PORT, value: "9090"}
            - {name: BANK_GATEWAY_LEADERELECTION_ENABLED, value: "true"}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: BANK_MAINTENANCE_ENABLED
              valueFrom: {configMapKeyRef: {name: app-config, key: BANK_MAINTENANCE_ENABLED}}
            - name: BANK_MAINTENANCE_START
              valueFrom: {configMapKeyRef: {name: app-config, key: BANK_MAINTENANCE_START}}
            - name: BANK_MAINTENANCE_END
              valueFrom: {configMapKeyRef: {name: app-config, key: BANK_MAINTENANCE_END}}
            - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT   # P9b 추적 보내기 (api 와 같은 값 — 한 곳)
              valueFrom: {configMapKeyRef: {name: app-config, key: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT}}
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              valueFrom: {configMapKeyRef: {name: app-config, key: MANAGEMENT_TRACING_SAMPLING_PROBABILITY}}
            - name: LOGGING_STRUCTURED_FORMAT_CONSOLE   # P9c 구조화 로그 (api 와 같은 값 — 한 곳). L2 끔 실험이 키를 지워도 뜨게 optional
              valueFrom: {configMapKeyRef: {name: app-config, key: LOGGING_STRUCTURED_FORMAT_CONSOLE, optional: true}}
          ports:
            - {name: http, containerPort: 8082}
          # preStop 없음 (결정 12): 호출자(api)는 "안 보냄"(503 · 연결 거부)을 안전하게 재시도한다 — SIGTERM 에 바로 물러나는 편이 교대 공백이 짧다
          startupProbe:   # 기동(최대 120초) 동안은 liveness 가 죽이지 못하게
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:   # 대기자 UP(standby), 리더는 은행 회선을 따라간다
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:   # 실패하면 재시작 — 프로세스가 멈췄을 때만. 외부 의존성은 넣지 않는다
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {memory: 512Mi, cpu: 100m}
            limits: {memory: 512Mi}
