# api 2대 (스펙 §5). 이름 = Pod 이름(INFO_INSTANCE). 워커 두 개에 나눠 놓되 ScheduleAnyway —
# DoNotSchedule 이면 워커 하나가 죽었을 때 남은 노드에 두 번째 api 를 못 띄운다 (스펙 §4-2)
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: {app: api}
spec:
  selector: {app: api}
  ports:
    - {name: http, port: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      enableServiceLinks: false   # redis Service 가 REDIS_PORT=tcp://… 를 넣으면 redis 주소가 깨진다 (${REDIS_PORT:6379})
      nodeSelector: {bank-transfer/role: app}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: api}
      containers:
        - name: api
          image: bank-transfer/api:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: app-config}
          env:
            - name: MYSQL_DATABASE
              valueFrom: {secretKeyRef: {name: db-credentials, key: MYSQL_DATABASE}}
            - name: MYSQL_USER
              valueFrom: {secretKeyRef: {name: db-credentials, key: MYSQL_USER}}
            - name: MYSQL_PASSWORD
              valueFrom: {secretKeyRef: {name: db-credentials, key: MYSQL_PASSWORD}}
            - name: INFO_INSTANCE   # /actuator/info 의 instance · ShedLock locked_by
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:   # Spring 기본 readinessState 만 — DB · Kafka · 게이트웨이를 넣지 않는다 (스펙 결정 9)
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests: {memory: 768Mi, cpu: 250m}
            limits: {memory: 768Mi}
