# P8-3a 공통 매니페스트. namespace 는 여기서 한 번에 (Namespace · GatewayClass 같은 클러스터 범위는 infra/k8s/cluster/)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bank-transfer
resources:
  - config.yaml
  - mysql.yaml
  - kafka.yaml
  - redis.yaml
  - mock-bank.yaml
  - bank-gateway.yaml
  - rbac-gateway.yaml   # ConfigMap bank-gateway-tran-no 는 일부러 없다 — 다시 apply 하면 reservedTo 가 되돌아가 전문번호가 겹친다 (처음 예약자가 만든다)
  - api.yaml
  - gateway.yaml
  - networkpolicy.yaml
  - pdb.yaml
