# R1 대조 (스펙 §6-3): api 의 preStop 을 뺀다 → 삭제와 동시에 SIGTERM. 끝나면 apply_overlay local <태그> 로 되돌린다
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../local
patches:
  - target: {kind: Deployment, name: api}
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/lifecycle
