# CI: 점검 시간(23:50 ~ 00:10 KST)에 돌아도 503 이 나지 않게 (P8-2 app-smoke 와 같은 이유)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: {kind: ConfigMap, name: app-config}
    patch: |-
      - op: replace
        path: /data/BANK_MAINTENANCE_ENABLED
        value: "false"
