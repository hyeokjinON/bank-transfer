# 로컬 개발 인프라 (P3-0) — MySQL 8.4 · Kafka 4.1 (KRaft, 단일 노드) · Redis 7.4
# 실행:  docker compose -f infra/docker-compose.yml --env-file infra/.env up -d --wait
# 확인:  bash infra/verify.sh
# 종료:  docker compose -f infra/docker-compose.yml down        (데이터까지 지우려면 down -v)
# 설계 이유: docs/adr/0003-local-infra-docker-compose.md

name: bank-transfer

services:
  mysql:
    image: mysql:8.4                      # 8.4 = 장기 지원(LTS) 버전
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bank_transfer}
      MYSQL_USER: ${MYSQL_USER:-bank}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?infra/.env 에 MYSQL_PASSWORD 를 정하세요}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?infra/.env 에 MYSQL_ROOT_PASSWORD 를 정하세요}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4      # 한글 · 이모지까지 저장
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql           # 컨테이너를 지워도 데이터는 남는다 (down -v 로만 삭제)
    healthcheck:                            # "준비됨"의 기준: 접속해서 응답하는가
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  kafka:
    image: apache/kafka:4.1.0               # Kafka 4.x 는 ZooKeeper 없이 KRaft 만 지원
    environment:
      # --- KRaft: 한 노드가 브로커(메시지 저장)와 컨트롤러(메타데이터 관리)를 함께 맡는다 ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # --- 리스너: 컨테이너끼리는 kafka:29092, 내 PC(IntelliJ 로 띄운 앱)에서는 localhost:9092 ---
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # --- 노드가 1대뿐이라 내부 토픽 복제 수도 1 (운영은 3대 · 복제 3 · min.insync.replicas 2) ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # --- 토픽은 코드나 스크립트로 명시적으로 만든다 (오타 토픽이 몰래 생기는 것 방지) ---
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data   # 예전 회사처럼 /tmp 에 두지 않는다
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]   # AOF: 재기동해도 데이터 유지
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 선택: Kafka 토픽 · 메시지를 웹 화면으로 보기 (기본 실행에는 포함 안 됨)
  #   docker compose -f infra/docker-compose.yml --env-file infra/.env --profile tools up -d
  #   → http://localhost:8089
  kafka-ui:
    image: kafbat/kafka-ui:latest
    profiles: ["tools"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8089:8080"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  mysql-data:
  kafka-data:
  redis-data:
