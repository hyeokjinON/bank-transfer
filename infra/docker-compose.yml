# 로컬 개발 인프라 (P3-0) — MySQL 8.4 · Kafka 4.1 (KRaft, 단일 노드) · Redis 7.4 · (선택) k6 2.3 부하 측정
# 앱까지 컨테이너로 (P8-2, app 프로필) — 모의 은행 · 게이트웨이 · api 2대 · nginx(:8000). IntelliJ 의 API · 게이트웨이 · 모의 은행과 동시에 띄우지 않는다
# 실행:  docker compose -f infra/docker-compose.yml --env-file infra/.env up -d --wait
#        docker compose -f infra/docker-compose.yml --env-file infra/.env --profile app up -d --build --wait
# 확인:  bash infra/verify.sh   ·   bash infra/app-smoke.sh (app 프로필)
# 종료:  docker compose -f infra/docker-compose.yml down        (데이터까지 지우려면 down -v. app 프로필까지면 --profile app)
# 설계 이유: docs/adr/0003-local-infra-docker-compose.md · docs/adr/0016-app-images-compose.md

name: bank-transfer

# --- P8-2 앱 컨테이너(app 프로필) 공통 블록 — YAML anchor 로 같은 값을 한 번만 쓴다 ---
x-java-app: &java-app
  restart: unless-stopped
  stop_grace_period: 30s          # 앱의 graceful 단계(20s)보다 길게 — 처리 중인 요청 · 메시지를 끝낼 시간을 준 뒤 SIGKILL

# 은행 점검 시간 (P5-1). api(접수 503)와 게이트웨이(송신 보류)가 같은 창이어야 한다 — 컨테이너 실행에서는 이 한 곳에서 둘에 넣는다 (스펙 §3-11)
x-bank-maintenance: &bank-maintenance
  BANK_MAINTENANCE_ENABLED: "${BANK_MAINTENANCE_ENABLED:-true}"
  BANK_MAINTENANCE_START: "${BANK_MAINTENANCE_START:-23:50}"
  BANK_MAINTENANCE_END: "${BANK_MAINTENANCE_END:-00:10}"

# api 두 대의 환경변수. 이름은 Spring 의 느슨한 바인딩 표준형 (bank.gateway.http.base-url → BANK_GATEWAY_HTTP_BASEURL)
x-api-env: &api-env
  <<: *bank-maintenance
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"              # 명시: infra/.env 의 MYSQL_PORT 는 PC 쪽 포트(바꿔 쓸 수 있다) — 그대로 넘기면 컨테이너 안에서 틀린 포트로 붙는다
  MYSQL_DATABASE: ${MYSQL_DATABASE:-bank_transfer}
  MYSQL_USER: ${MYSQL_USER:-bank}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?infra/.env 에 MYSQL_PASSWORD 를 정하세요}
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  REDIS_HOST: redis
  BANK_GATEWAY_MODE: http         # 앱 기본값과 같지만 명시 (P8-2)
  BANK_GATEWAY_HTTP_BASEURL: http://bank-gateway:8082
  DAILYRECON_FILEDIR: /data/bank-files   # 모의 은행이 쓴 대사 파일 (공유 볼륨, 읽기 전용)
  DAILYRECON_SCHEDULE_CRON: "${API_DAILY_RECON_CRON:-0 0 1-6 * * *}"   # 실험 E5 만 바꾼다 (2분마다)

x-api: &api
  <<: *java-app
  image: bank-transfer/api:dev
  build:
    context: ..
    dockerfile: Dockerfile
    target: api
  profiles: ["app"]
  mem_limit: 768m
  volumes:
    - bank-files:/data/bank-files:ro
  healthcheck:                    # readiness: 기동이 끝나 요청을 받을 수 있나 (종료 중이면 OUT_OF_SERVICE)
    test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 90s
  depends_on:
    mysql:
      condition: service_healthy
    kafka:
      condition: service_healthy
    redis:
      condition: service_healthy
    bank-gateway:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.4                      # 8.4 = 장기 지원(LTS) 버전
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bank_transfer}
      MYSQL_USER: ${MYSQL_USER:-bank}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?infra/.env 에 MYSQL_PASSWORD 를 정하세요}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?infra/.env 에 MYSQL_ROOT_PASSWORD 를 정하세요}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4      # 한글 · 이모지까지 저장
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql           # 컨테이너를 지워도 데이터는 남는다 (down -v 로만 삭제)
    healthcheck:                            # "준비됨"의 기준: 접속해서 응답하는가
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  kafka:
    image: apache/kafka:4.1.0               # Kafka 4.x 는 ZooKeeper 없이 KRaft 만 지원
    environment:
      # --- KRaft: 한 노드가 브로커(메시지 저장)와 컨트롤러(메타데이터 관리)를 함께 맡는다 ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # --- 리스너: 컨테이너끼리는 kafka:29092, 내 PC(IntelliJ 로 띄운 앱)에서는 localhost:9092 ---
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # --- 노드가 1대뿐이라 내부 토픽 복제 수도 1 (운영은 3대 · 복제 3 · min.insync.replicas 2) ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # --- 토픽은 코드나 스크립트로 명시적으로 만든다 (오타 토픽이 몰래 생기는 것 방지) ---
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data   # 예전 회사처럼 /tmp 에 두지 않는다
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]   # AOF: 재기동해도 데이터 유지
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 선택: Kafka 토픽 · 메시지를 웹 화면으로 보기 (기본 실행에는 포함 안 됨)
  #   docker compose -f infra/docker-compose.yml --env-file infra/.env --profile tools up -d
  #   → http://localhost:8089
  kafka-ui:
    image: kafbat/kafka-ui:latest
    profiles: ["tools"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8089:8080"
    depends_on:
      kafka:
        condition: service_healthy

  # 망 지연 주입 (P8-1; 측정은 latency toxic 만, 연결 끊김은 TcpCutProxy 테스트 픽스처). 기본 실행에는 포함 안 됨 — 측정 스크립트(load/lib/gateway.sh)가 쓴다:
  #   docker compose -f infra/docker-compose.yml --env-file infra/.env --profile chaos up -d toxiproxy
  # 제어 API :8474 (프록시 · toxic 만들기), 프록시 :28082 → PC 에서 띄운 측정용 게이트웨이(host.docker.internal:18082)
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    profiles: ["chaos"]
    ports:
      - "8474:8474"
      - "28082:28082"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 리눅스(CI)에서도 PC(호스트)를 이 이름으로 (Docker Desktop 은 기본 제공)

  # 부하 측정 (P4-2). 기본 실행에는 포함 안 됨 — load/run.sh 가 부른다:
  #   docker compose -f infra/docker-compose.yml --env-file infra/.env --profile load run --rm k6 run /scripts/hotspot.js
  # 스크립트는 load/, 요약 JSON 은 docs/perf/raw/ 로 나온다. 대상은 PC 에서 띄운 앱(host.docker.internal:8080)
  k6:
    image: grafana/k6:2.3.0
    profiles: ["load"]
    volumes:
      - ../load:/scripts:ro
      - ../docs/perf/raw:/out
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 리눅스에서도 PC(호스트)에 닿게. Docker Desktop 은 원래 된다

  # --- P8-2 app 프로필: 모의 은행 → 게이트웨이(은행 연결 UP) → api-1 · api-2 → nginx 순서로 뜬다. PC 포트는 nginx 8000 하나 ---
  #   docker compose -f infra/docker-compose.yml --env-file infra/.env --profile app up -d --build --wait
  #   확인 bash infra/app-smoke.sh · 로그 docker compose ... --profile app logs -f api-1 · 안에서 보기 docker compose ... exec bank-gateway wget -qO- localhost:8082/actuator/health
  mock-bank:
    <<: *java-app
    image: bank-transfer/mock-bank:dev
    build:
      context: ..
      dockerfile: Dockerfile
      target: mock-bank
    profiles: ["app"]
    mem_limit: 256m
    volumes:
      - bank-files:/data/bank-files   # 거래 기록 · 대사 파일을 쓴다 (운영이면 은행 SFTP · 오브젝트 스토리지 자리)
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9090"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  bank-gateway:
    <<: *java-app
    image: bank-transfer/bank-gateway:dev
    build:
      context: ..
      dockerfile: Dockerfile
      target: bank-gateway
    profiles: ["app"]
    mem_limit: 512m
    environment:
      <<: *bank-maintenance
      BANK_GATEWAY_HOST: mock-bank
      BANK_GATEWAY_PORT: "9090"
    healthcheck:                    # 전체 health 에 bankConnection 이 들어 있다 — 은행에 붙어야 UP
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8082/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    depends_on:
      mock-bank:
        condition: service_healthy

  # 같은 이미지 두 대. 이름을 나눠 로그 · 장애 실험 · 확인이 인스턴스별로 또렷하게 (--scale 대신, 스펙 §3-4)
  api-1:
    <<: *api
    environment:
      <<: *api-env
      INFO_INSTANCE: api-1

  api-2:
    <<: *api
    environment:
      <<: *api-env
      INFO_INSTANCE: api-2

  nginx:
    image: nginx:1.27-alpine
    profiles: ["app"]
    restart: unless-stopped
    ports:
      - "8000:80"                   # PC 에 여는 유일한 포트 (게이트웨이 · 모의 은행 · api 는 내부망 전용 — ADR-0015 위험의 첫 조치)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy

volumes:
  mysql-data:
  kafka-data:
  redis-data:
  bank-files:
