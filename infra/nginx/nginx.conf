# P8-2 api 두 대 앞의 nginx (Compose app 프로필, ADR-0016). PC 에 열리는 포트는 이 nginx 의 8000 하나다.
# /etc/nginx/conf.d/default.conf 로 마운트한다 — 이 파일은 http { } 안에 들어간다.

# 접근 로그: 받은 시각(초.밀리초) · 상태 · 메서드 · 경로 · 어느 api · 그 api 의 상태 · 걸린 시간 (실험 E3 · E4 가 센다)
log_format upstream '$msec $status $request_method $uri $upstream_addr $upstream_status $request_time';

upstream api {
    zone api 64k;   # 워커끼리 순번 · 실패 횟수를 공유 — 없으면 워커마다 따로 세서 요청이 적을 때 한 대로 쏠려 보인다
    # nginx 는 기동 때 한 번만 이름을 푼다 — api 컨테이너를 다시 만들면(설정을 바꿔 up -d) nginx 도 restart 한다 (OPERATION §14)
    server api-1:8080 max_fails=3 fail_timeout=10s;
    server api-2:8080 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    access_log /var/log/nginx/access.log upstream;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 연결조차 못 한 요청만 다른 서버로 (error · timeout). non_idempotent 를 넣지 않는다 — 이미 보낸 POST 를 다시 보내지 않는다 (이중 접수 방지).
        # 출금은 멱등키로도 막히지만 1원인증 요청에는 키가 없다. P8-1 "연결 단계 실패만 안 보냄" 과 같은 규칙
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 1s;
        proxy_read_timeout 10s;                        # api 가 게이트웨이를 기다리는 시간(5s)보다 길게 — 안쪽이 먼저 끝나게
        add_header X-Upstream $upstream_addr always;   # 어느 api 가 받았나 (IP:포트. 이름은 /actuator/info 의 instance)
    }
}
