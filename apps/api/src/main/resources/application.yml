spring:
  application:
    name: bank-transfer
  mvc:
    problemdetails:
      enabled: true   # ApiExceptionHandler 가 ResponseEntityExceptionHandler 를 상속하므로 표준 오류도 ProblemDetail + code 로 응답한다 (Boot 기본 핸들러는 물러난다. 설정은 명시용으로 유지)
  datasource:
    # 로컬은 infra/docker-compose.yml 의 MySQL (값은 infra/.env.example 과 같다). 시각은 KST 로 저장한다 (docs/database.md §2)
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:bank_transfer}?connectionTimeZone=Asia/Seoul&forceConnectionTimeZoneToSession=true
    username: ${MYSQL_USER:bank}
    password: ${MYSQL_PASSWORD:local-dev-only}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all                    # ISR 모두 기록돼야 성공 (운영 3대 · min.insync.replicas=2 와 짝)
      properties:
        enable.idempotence: true   # 프로듀서 재시도가 브로커에 중복 기록되지 않게
        max.block.ms: 5000         # 브로커에 닿지 않으면 send() 가 기본 60초 대신 5초만 기다린다 → 발행기 트랜잭션이 빨리 끝난다
    consumer:
      group-id: transfer-processor
      auto-offset-reset: earliest
      enable-auto-commit: false    # 처리를 끝낸 뒤에만 커밋 (리스너가 ack)
      max-poll-records: 50         # 한 건이 은행 호출로 최대 3초 막힐 수 있다. 기본 500건이면 한 번의 poll 이 max.poll.interval.ms(5분)를 넘겨 리밸런스가 날 수 있다
    listener:
      ack-mode: manual_immediate
  jpa:
    open-in-view: false        # 트랜잭션 밖(뷰 렌더링)에서 지연 로딩하지 않는다
    hibernate:
      ddl-auto: validate       # 스키마는 Flyway 만 바꾼다. 엔티티와 다르면 기동 실패
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
      # Hibernate 7 은 Instant 를 기본으로 UTC 로 쓴다. 위 time_zone 을 따르게 하려면 이 설정이 필요하다
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP

bank:
  gateway:
    host: localhost
    port: 9090
    response-timeout: 3s
    poll-interval: 30s

account:
  verification:
    ttl: 5m
    max-attempts: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info

transfer:
  outbox:
    relay:
      enabled: true      # 폴링 퍼블리셔 스케줄 (테스트는 끄고 직접 부른다)
      interval-ms: 500
      batch-size: 100
