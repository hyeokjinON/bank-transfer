spring:
  application:
    name: bank-transfer
  task:
    scheduling:
      pool:
        size: 3   # 발행기(0.5초) · 정리 작업(10초) · 일마감 대사(01 ~ 06시, 동기로 수 초)가 서로 막지 않게 (P5-1 에서 2 → 3)
  mvc:
    problemdetails:
      enabled: true   # ApiExceptionHandler 가 ResponseEntityExceptionHandler 를 상속하므로 표준 오류도 ProblemDetail + code 로 응답한다 (Boot 기본 핸들러는 물러난다. 설정은 명시용으로 유지)
  datasource:
    # 로컬은 infra/docker-compose.yml 의 MySQL (값은 infra/.env.example 과 같다). 시각은 KST 로 저장한다 (docs/database.md §2)
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:bank_transfer}?connectionTimeZone=Asia/Seoul&forceConnectionTimeZoneToSession=true
    username: ${MYSQL_USER:bank}
    password: ${MYSQL_PASSWORD:local-dev-only}
    hikari:
      # 풀 크기를 명시한다 (P4-2). 기본 10 이면 락 비교가 "풀이 작다"를 재게 된다(ADR-0008 의 10-way 경합 한계).
      # minimum-idle 기본값 = 최대 → 측정 중 커넥션을 새로 만들지 않는다
      maximum-pool-size: 20
      # 락 대기 한도를 커넥션마다 5초로 (MySQL 기본 50초). 50초 동안 커넥션 · 톰캣 스레드를 붙잡으면 장애가 번진다.
      # 넘으면 1205 → 503 WALLET_BUSY. 발행기 · 정리 작업 트랜잭션에도 적용된다 (지금은 짧아 영향 없음 — HANDOVER)
      connection-init-sql: SET SESSION innodb_lock_wait_timeout = 5
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all                    # ISR 모두 기록돼야 성공 (운영 3대 · min.insync.replicas=2 와 짝)
      properties:
        enable.idempotence: true   # 프로듀서 재시도가 브로커에 중복 기록되지 않게
        max.block.ms: 5000         # 브로커에 닿지 않으면 send() 가 기본 60초 대신 5초만 기다린다 → 발행기 트랜잭션이 빨리 끝난다
    consumer:
      group-id: transfer-processor
      auto-offset-reset: earliest
      enable-auto-commit: false    # 처리를 끝낸 뒤에만 커밋 (리스너가 ack)
      max-poll-records: 50         # 한 건이 은행 호출로 최대 3초 막힐 수 있다. 기본 500건이면 한 번의 poll 이 max.poll.interval.ms(5분)를 넘겨 리밸런스가 날 수 있다
    listener:
      ack-mode: manual_immediate
      concurrency: 3               # 컨테이너마다 컨슈머 3개 (파티션 3). 재시도 · DLT 컨테이너도 같다. 그룹 · 동시성은 여기서만 정한다
  jpa:
    open-in-view: false        # 트랜잭션 밖(뷰 렌더링)에서 지연 로딩하지 않는다
    hibernate:
      ddl-auto: validate       # 스키마는 Flyway 만 바꾼다. 엔티티와 다르면 기동 실패
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
      # Hibernate 7 은 Instant 를 기본으로 UTC 로 쓴다. 위 time_zone 을 따르게 하려면 이 설정이 필요하다
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
  batch:
    job:
      enabled: false           # 기동 때 잡을 자동 실행하지 않는다 (기본 true). 대사는 스케줄 · 관리 API 가 날짜를 주어 돌린다 (P5-1)
    jdbc:
      initialize-schema: never # BATCH_* 표는 Flyway V4 가 만든다 (스키마는 Flyway 로만)

bank:
  gateway:
    host: localhost
    port: 9090
    response-timeout: 3s
    poll-interval: 30s
  maintenance:                 # 은행 점검 시간 (P5-1, KST). 점검 중에는 출금 접수 · 1원인증 503, 은행 송신 보류
    enabled: true
    start: "23:50"             # 따옴표 필수 — YAML 은 23:50 을 60진수 정수로 읽는다. 시작 포함 · 끝 제외, 자정을 넘어도 된다
    end: "00:10"               # 점검 길이는 재발행 포기(E001)까지의 약 26분보다 짧게 (OPERATION §9)

account:
  verification:
    ttl: 5m
    max-attempts: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true   # info.* 설정을 /actuator/info 에 보인다 (P4-2: 차감 전략)

transfer:
  retry:                       # 재시도 토픽 (P3-3b). 은행에 보내지도 못한 메시지만 온다
    attempts: 4                # 원래 1 + 재시도 3
    delay-ms: 5000             # 첫 간격. 게이트웨이 재접속(1초 → 2초 …)보다 길게
    multiplier: 6.0            # 5s → 30s → 60s(최대)
    max-delay-ms: 60000
  outbox:
    relay:
      enabled: true      # 폴링 퍼블리셔 스케줄 (테스트는 끄고 직접 부른다)
      interval-ms: 500
      batch-size: 100
  reconcile:
    enabled: true          # 정리 작업 스케줄 (테스트는 끄고 직접 부른다)
    interval-ms: 10000
    sending-timeout: 30s   # 이보다 오래 SENDING 이면 UNKNOWN 으로 본다. UNKNOWN 도 sending_at 이 이만큼 지나야 결과조회 (유예)
    max-inquiries: 10      # 결과조회도 계속 모르면 멈추고 경고 → 일마감 대사
    batch-size: 100
    republish-after: 5m    # 마지막 변경 후 이만큼 지나야 재발행 (재시도 토픽 · DLT 약 95초와 겹치지 않게, P3-3b)
    max-republish: 3       # 다 쓰고도 은행에 못 보내면 FAILED E001 (은행에 간 적 없음 → 사용자가 다시 요청)

wallet:
  # 잔고 차감 전략 (P4-2, ADR-0009): conditional | pessimistic | optimistic | redis. 기동 때 하나만 — 모르는 이름이면 기동 실패
  debit-strategy: conditional
  optimistic:
    max-attempts: 5        # 버전 충돌이면 트랜잭션 전체를 처음부터. 다 쓰면 409 CONCURRENT_UPDATE
    backoff-min: 10ms      # 시도 사이 무작위 대기 — 같은 순간 다시 부딪히지 않게
    backoff-max: 50ms
  lock:
    wait-time: 3s          # redis 전략: 사용자 락을 기다리는 최대 시간. 넘으면 503 WALLET_BUSY
    redis-address: "redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}"   # redis 전략일 때만 클라이언트를 만든다

daily-recon:                   # 일마감 대사 (P5-1, ADR-0010)
  file-dir: ./bank-files       # 은행 대사 파일 디렉터리 (recon/RECON_yyyyMMdd.dat). 작업 디렉터리 = 저장소 루트 (git 제외)
  chunk-size: 100              # ③ 출금 대조 · ④ 은행 줄 대조 청크. ② 적재는 500 고정
  schedule:
    enabled: true              # 부하 측정 실행 구성 · 테스트는 false
    cron: "0 0 1-6 * * *"      # 01:00 ~ 06:00 매시 정각에 전날 대사. 파일이 없으면 다음 정각에 다시, 마지막 회차(06시)에도 못 끝내면 긴급 알림
    zone: Asia/Seoul

alert:
  telegram:
    # 둘 다 있을 때만 텔레그램으로 보낸다 (없으면 로그만). 값은 환경변수로만 — 저장소 · 로그에 남기지 않는다 (SETUP 2-6)
    bot-token: ${ALERT_TELEGRAM_BOT_TOKEN:}
    chat-id: ${ALERT_TELEGRAM_CHAT_ID:}
    base-url: https://api.telegram.org

info:
  wallet:
    debit-strategy: ${wallet.debit-strategy}   # /actuator/info 로 지금 전략을 본다 (load/run.sh 가 측정 전에 확인)
